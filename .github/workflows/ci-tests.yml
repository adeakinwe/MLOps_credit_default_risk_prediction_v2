name: CI-Tests
on:
  pull_request:
    branches:
      - 'dev'
    paths:
      - '06-best-practises/**'

env:
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install dependencies
        working-directory: 06-best-practises
        run: pip install pipenv && pipenv install --dev

      - name: Run Unit tests
        working-directory: 06-best-practises
        run: pipenv run pytest unit_tests/

      - name: Lint
        working-directory: 06-best-practises
        run: pipenv run pylint --recursive=y --exit-zero .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Integration Test
        working-directory: 06-best-practises/integration_test
        run: |
          . run-make.sh

  tf-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - uses: hashicorp/setup-terraform@v2

      - name: TF plan
        id: plan
        working-directory: 06-best-practises/infrastructure
        run: |
          terraform init -backend-config="key=credit-default-risk-prediction-stg.tfstate" --reconfigure
          terraform plan --var-file=vars/prod.tfvars